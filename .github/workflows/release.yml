# Publish choices-ember to npm when a version tag is pushed.
#
# Setup (once):
#   1. npmjs.com → Access Tokens → Granular token (read/write for package choices-ember)
#   2. GitHub repo → Settings → Secrets → Actions → NPM_TOKEN
#
# Release:
#   1. Bump choices-ember/package.json "version" (e.g. 0.1.0)
#   2. Commit on main
#   3. git tag v0.1.0 && git push origin v0.1.0
#   Tag must match package.json (v0.1.0 ↔ 0.1.0).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance (optional attestation); safe even if provenance fails soft
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish choices-ember
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+: @embroider/addon-dev + package-up (ESM) require
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./choices-ember/package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match choices-ember/package.json version $PKG"
            echo "Bump package.json, commit, then retag."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build addon
        run: pnpm --filter choices-ember build

      - name: Pack (inspect contents)
        working-directory: choices-ember
        run: |
          set -euo pipefail
          pnpm pack
          echo "--- tarball contents (first 80 entries) ---"
          tar -tzf choices-ember-*.tgz | head -80

      - name: Publish to npm
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        working-directory: choices-ember
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing secret NPM_TOKEN. Add a granular npm token under repo Settings → Secrets."
            exit 1
          fi
          # --no-git-checks: CI checkout is not a full interactive git release clone
          # --access public: unscoped package on a free npm account
          # --provenance: link publish to this workflow (requires id-token: write)
          pnpm publish --access public --no-git-checks --provenance

      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != false
        run: |
          echo "Dry run complete — tarball built, nothing published."
          echo "Uncheck dry_run (or push a v* tag) to publish."
