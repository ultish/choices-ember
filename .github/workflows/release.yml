# Publish choices-ember to npm when a version tag is pushed.
#
# Auth (pick one — OTP tokens will NOT work in CI):
#
#   A) Recommended: npm Trusted Publishing (OIDC, no long-lived token)
#      1. First publish once (see README) so the package exists on npm
#      2. npmjs.com → package → Settings → Trusted Publisher → GitHub Actions:
#           Organization/user: ultish
#           Repository:        choices-ember
#           Workflow filename: release.yml
#           Allowed:           npm publish
#      3. Re-run this workflow (no NPM_TOKEN needed)
#
#   B) Granular access token WITH "Bypass two-factor authentication" checked
#      1. npmjs.com → Access Tokens → Granular Access Token
#      2. Packages: publish/create for choices-ember
#      3. ☑ Bypass two-factor authentication  ← required for CI
#      4. GitHub → Secrets → NPM_TOKEN = that token
#
# Release:
#   Bump choices-ember/package.json version, commit, then:
#     git tag v0.1.0 && git push origin v0.1.0
#   Tag must match package.json (v0.1.0 ↔ 0.1.0).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for OIDC trusted publishing + provenance
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish choices-ember
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and recent npm
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./choices-ember/package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match choices-ember/package.json version $PKG"
            echo "Bump package.json, commit, then retag."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build addon
        run: pnpm --filter choices-ember build

      - name: Pack (inspect contents)
        working-directory: choices-ember
        run: |
          set -euo pipefail
          pnpm pack
          echo "--- tarball contents (first 80 entries) ---"
          tar -tzf choices-ember-*.tgz | head -80

      - name: Publish to npm
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        working-directory: choices-ember
        env:
          # Optional fallback. Prefer OIDC trusted publishing (no token).
          # Do NOT use a 2FA-bound token — it will fail with EOTP in CI.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "npm $(npm --version) node $(node --version)"
          # npm CLI uses OIDC in GHA when id-token: write is set; then falls back to NODE_AUTH_TOKEN.
          # --access public: unscoped package on free accounts
          # provenance is automatic with trusted publishing; fine with tokens too
          npm publish --access public --provenance

      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != false
        run: |
          echo "Dry run complete — tarball built, nothing published."
          echo "Uncheck dry_run (or push a v* tag) to publish."
