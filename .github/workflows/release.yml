# Publish choices-ember to npm when a version tag is pushed.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN, no OTP in CI.
# npm recommends this over “Bypass 2FA” granular tokens.
#
# One-time setup (package must exist on npm first — see README if not):
#   npmjs.com → choices-ember → Settings → Trusted Publisher → GitHub Actions
#     Organization or user:  ultish
#     Repository:            choices-ember
#     Workflow filename:     release.yml
#     Allowed actions:       npm publish
#
# Release:
#   Bump choices-ember/package.json version, commit, then:
#     git tag v0.1.1 && git push origin v0.1.1
#   Tag must match package.json (v0.1.1 ↔ 0.1.1).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only — do not publish to npm'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for OIDC trusted publishing (+ automatic provenance)
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish choices-ember
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing: Node >= 22.14 and npm >= 11.5.1
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          # Avoid stale caches in release builds
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./choices-ember/package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match choices-ember/package.json version $PKG"
            echo "Bump package.json, commit, then retag."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build addon
        run: pnpm --filter choices-ember build

      - name: Pack (inspect contents)
        working-directory: choices-ember
        run: |
          set -euo pipefail
          pnpm pack
          echo "--- tarball contents (first 80 entries) ---"
          tar -tzf choices-ember-*.tgz | head -80

      - name: Publish to npm (OIDC trusted publishing)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        working-directory: choices-ember
        run: |
          set -euo pipefail
          echo "npm $(npm --version) node $(node --version)"
          # No NODE_AUTH_TOKEN — npm CLI uses GitHub OIDC when id-token: write is set.
          # Provenance is generated automatically with trusted publishing.
          # --access public: unscoped package on free accounts
          npm publish --access public

      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != false
        run: |
          echo "Dry run complete — tarball built, nothing published."
          echo "Uncheck dry_run (or push a v* tag) to publish."
